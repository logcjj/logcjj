name: Refresh live profile card

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live-profile-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update live card cache key
        run: node scripts/update-readme.mjs --heartbeat-only

      - name: Commit live card refresh
        run: |
          if git diff --quiet README.md; then
            echo "README is already fresh."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh live profile card"
          git push
